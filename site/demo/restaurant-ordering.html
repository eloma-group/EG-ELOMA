:root{--navy:#0d2239;--n80:#33465c;--n60:#5b6879;--n40:#929bab;--n20:#c9cfd8;--n10:#e3e7ec;--n5:#f2f4f6;--bg:#f7f8f9;--green:#2eb88a;--green-t:#17805e;--green-s:#e3f5ee;--green-m:#b8e7d5;--amber:#c98a1a;--red:#c2382b;--red-s:#fbeceb;--ink:#0d2239;--muted:#5b6879;--line:#e3e7ec;--leaf:16px 3px 16px 3px}
*{box-sizing:border-box}
body{margin:0;font-family:Manrope,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
/* sidebar — white, logo-led */
.side{background:#fff;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:22px 22px 18px;display:flex;align-items:center}
.brand img{height:48px;width:auto;display:block;image-rendering:-webkit-optimize-contrast}
.loc{margin:0 14px 8px;background:var(--n5);border-radius:var(--leaf);padding:9px 11px;display:flex;align-items:center;gap:10px}
.loc .av{width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--green);display:grid;place-items:center;font-weight:800;font-size:11px;letter-spacing:.02em}
.loc b{display:block;font-size:13px;font-weight:700}.loc small{color:var(--muted);font-size:11.5px}
.loc svg{margin-left:auto;color:var(--n40)}
.nav{padding:4px 14px}
.nav-sec{font-size:11px;font-weight:700;color:var(--n40);padding:16px 10px 6px;text-transform:uppercase;letter-spacing:.08em}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--leaf);color:var(--n80);text-decoration:none;font-weight:600;margin-bottom:2px}
.nav a:hover{background:var(--n5);color:var(--navy)}
.nav a.on{background:var(--navy);color:#fff}
.nav a.on svg{color:var(--green)}
.cnt{margin-left:auto;background:var(--green);color:var(--navy);font-size:11px;font-weight:800;min-width:20px;text-align:center;padding:0 6px;border-radius:10px;line-height:19px}
.side-foot{margin-top:auto;padding:14px;border-top:1px solid var(--line)}
.demo{border-radius:var(--leaf);background:var(--n5);padding:12px;margin-bottom:14px;font-size:12px}
.demo .t{color:var(--n60);font-weight:700;font-size:10.5px;letter-spacing:.08em;margin-bottom:9px}
.demo button{width:100%;background:#fff;border:1px solid var(--n10);color:var(--navy);border-radius:8px;padding:7px;cursor:pointer;margin-bottom:6px;font-size:12px;font-weight:600}
.demo button:hover{border-color:var(--green)}
.demo label{display:flex;gap:7px;align-items:center;cursor:pointer;color:var(--n80);font-weight:500}
.demo input{accent-color:var(--green)}
.user{display:flex;align-items:center;gap:10px}
.user .av{width:34px;height:34px;border-radius:50%;background:var(--green);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:12px}
.user b{font-size:13px;display:block;font-weight:700}.user small{color:var(--muted);font-size:11.5px}
/* top */
main{min-width:0;display:flex;flex-direction:column}
.top{height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 32px;background:var(--bg);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.crumb{color:var(--muted);display:flex;gap:8px;align-items:center;font-weight:500}.crumb b{color:var(--navy);font-weight:700}
.top-r{display:flex;align-items:center;gap:16px;color:var(--muted);font-weight:500}
.status-chip{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:20px;padding:6px 12px;font-weight:700;color:var(--navy);background:var(--green-s);cursor:pointer;font-size:12.5px}
.status-chip:has(.off){background:var(--red-s);color:var(--red)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 0 3px rgba(46,184,138,.25)}
.dot.off{background:var(--red);box-shadow:none}
.bell{position:relative;border:0;background:#fff;border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--navy);display:grid;place-items:center}
.bell i{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--green);border:2px solid #fff}
#view{padding:28px 32px 60px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.ph h1{font-size:24px;font-weight:800;margin:0;letter-spacing:-.02em}.ph p{margin:4px 0 0;color:var(--muted);font-weight:500}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
/* primitives */
.btn{border:1px solid var(--n20);background:#fff;border-radius:10px;padding:8px 15px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--navy);text-decoration:none;font-size:13px}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;border-radius:var(--leaf)}.btn.primary:hover{background:#163352}
.btn.primary svg{color:var(--green)}
.btn.danger{color:var(--red);border-color:#efc2bd}.btn.danger:hover{background:var(--red-s)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%;justify-content:center;padding:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--line);border-radius:14px}
.ch{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.ch h3{margin:0;font-size:14.5px;font-weight:800}.ch .sub{color:var(--muted);font-size:12.5px;font-weight:500}
.cb{padding:16px 20px}
.muted{color:var(--muted)}.small{font-size:12.5px}.r{text-align:right}.nowrap{white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:6px;padding:0 9px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;line-height:22px;border:1px solid transparent}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-new{background:#fff;color:var(--navy);border-color:var(--n20)}
.b-preparing{background:var(--green-s);color:var(--green-t)}
.b-ready{background:var(--green);color:var(--navy)}
.b-completed{background:var(--n5);color:var(--n60)}
.b-cancelled{background:var(--red-s);color:var(--red)}
.tag{display:inline-block;padding:0 7px;border-radius:5px;font-size:11.5px;font-weight:700;background:var(--n5);color:var(--n80);line-height:20px}
.input,select.input{border:1px solid var(--n20);border-radius:10px;padding:8px 11px;background:#fff;outline:none;width:100%}
.input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-s)}
.search{position:relative}.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--n40)}.search .input{padding-left:34px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:12px 10px;cursor:pointer;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--navy)}
.tab.on{color:var(--navy);border-bottom-color:var(--green)}
.tab .n{background:var(--n5);border-radius:10px;padding:0 7px;font-size:11.5px;color:var(--n80)}
.tab.on .n{background:var(--navy);color:#fff}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--n5);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--muted);font-size:12.5px}
.seg button.on{background:var(--navy);color:#fff}
.seg button:disabled{cursor:not-allowed;opacity:.6}
.switch{position:relative;width:36px;height:21px;border-radius:99px;background:var(--n20);border:0;cursor:pointer;transition:.15s;flex:none}
.switch:after{content:"";position:absolute;top:2.5px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch.on{background:var(--green)}.switch.on:after{left:17px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;color:var(--n60);font-weight:700;padding:10px 20px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
td{padding:12px 20px;border-bottom:1px solid var(--n5);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:#fafbfb}
.tablewrap{overflow-x:auto}
.tfoot{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:500}
.empty{color:var(--muted);text-align:center;padding:28px 8px;font-weight:500}
.field{margin-bottom:14px}.field label{display:block;font-size:12.5px;font-weight:700;color:var(--n80);margin-bottom:6px}
.field .hint{font-size:12px;color:var(--muted);margin-top:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{padding:18px 20px}.kpi .l{color:var(--muted);font-weight:700;font-size:12.5px}.kpi .v{font-size:28px;font-weight:800;margin:6px 0 4px;letter-spacing:-.025em}
.kpi:first-child{background:var(--navy);border-color:var(--navy);color:#fff;border-radius:22px 6px 22px 6px;position:relative;overflow:hidden}
.kpi:first-child .l,.kpi:first-child .muted{color:#9fb0c4}.kpi:first-child .delta.up{color:var(--green)}
.kpi:first-child:after{content:"";position:absolute;right:-28px;bottom:-40px;width:120px;height:80px;background:var(--green);opacity:.9;border-radius:80px 0 80px 0;transform:rotate(-28deg)}
.delta{font-weight:800;font-size:12.5px}.delta.up{color:var(--green-t)}.delta.down{color:var(--red)}
.dgrid{display:grid;grid-template-columns:1.65fr 1fr;gap:16px;margin-bottom:16px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);font-weight:600}.legend i{display:inline-block;width:9px;height:9px;border-radius:5px 1px 5px 1px;margin-right:6px}
.live{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 20px 4px}
.live div{padding:12px 14px;border-radius:var(--leaf);background:var(--n5)}
.live div:nth-child(3){background:var(--green-s)}
.live b{display:block;font-size:24px;font-weight:800}.live span{color:var(--muted);font-size:12.5px;font-weight:600}
/* storefront (customer site, same brand) */
.browser{border:1px solid var(--n20);border-radius:14px;overflow:hidden;background:#fff}
.bbar{height:40px;background:var(--n5);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 14px}
.bbar .d{display:flex;gap:6px}.bbar .d i{width:10px;height:10px;border-radius:50%;background:var(--n20)}
.url{flex:1;max-width:460px;margin:0 auto;background:#fff;border-radius:8px;padding:4px 10px;font-size:12.5px;color:var(--n80);display:flex;align-items:center;gap:6px;justify-content:center;font-weight:500}
.site{background:#fff;color:var(--navy)}
.s-nav{display:flex;justify-content:space-between;align-items:center;padding:16px 36px;background:var(--navy);color:#fff}
.s-logo{font-size:20px;font-weight:800;letter-spacing:-.01em}
.s-nav nav{display:flex;gap:24px;font-size:13px;color:#b9c6d6;font-weight:600}
.s-head{padding:30px 36px 22px;background:var(--navy);color:#fff;position:relative;overflow:hidden;border-bottom-right-radius:64px}
.s-head:after{content:"";position:absolute;right:60px;top:-30px;width:180px;height:120px;background:var(--green);border-radius:120px 0 120px 0;transform:rotate(-24deg);opacity:.95}
.s-head h2{font-weight:800;font-size:30px;margin:0 0 8px;letter-spacing:-.02em;position:relative;z-index:1}
.s-meta{display:flex;gap:20px;flex-wrap:wrap;color:#b9c6d6;font-size:13px;font-weight:500;position:relative;z-index:1}
.s-meta span{display:inline-flex;gap:6px;align-items:center}.s-meta svg{color:var(--green)}
.s-body{display:grid;grid-template-columns:1fr 330px;gap:30px;padding:0 36px 36px;align-items:start}
.s-cats{position:sticky;top:60px;background:#fff;z-index:2;display:flex;gap:6px;padding:16px 0 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.s-cats button{border:1px solid var(--n10);background:#fff;padding:6px 14px;border-radius:20px;cursor:pointer;font-weight:700;color:var(--n80);white-space:nowrap}
.s-cats button:hover{border-color:var(--green);color:var(--navy)}
.s-sec h3{font-weight:800;font-size:18px;margin:26px 0 4px;display:flex;align-items:center;gap:10px}
.s-sec h3:before{content:"";width:14px;height:9px;background:var(--green);border-radius:9px 0 9px 0}
.mi{display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--n5);cursor:pointer}
.mi:hover .mn{color:var(--green-t)}
.mi .mn{font-weight:700;font-size:14.5px}.mi .md{color:var(--muted);font-size:13px;margin:2px 0 6px;font-weight:500}
.mi .mp{font-weight:800;font-size:13.5px}
.mi .addb{width:34px;height:34px;border-radius:12px 3px 12px 3px;background:var(--navy);color:var(--green);display:grid;place-items:center;flex:none;align-self:center}
.mi:hover .addb{background:var(--green);color:var(--navy)}
.mi.out{opacity:.45;cursor:default}.mi.out:hover .mn{color:inherit}
.diet{font-size:10.5px;font-weight:800;color:var(--green-t);background:var(--green-s);border-radius:4px;padding:0 5px;margin-left:7px;vertical-align:1px}
.popular{font-size:11px;font-weight:800;color:var(--navy);margin-left:8px;text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid var(--green)}
.s-cart{position:sticky;top:72px;margin-top:22px;background:var(--n5);border-radius:20px 6px 20px 6px;padding:20px}
.s-cart h4{margin:0 0 14px;font-size:16px;font-weight:800}
.s-seg{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:12px;padding:3px;margin-bottom:14px}
.s-seg button{border:0;background:none;padding:8px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--muted);font-size:12.5px}
.s-seg button.on{background:var(--navy);color:#fff}
.cl{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--n10)}
.cl .mods{color:var(--muted);font-size:12px;font-weight:500}
.qty{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--n10);border-radius:9px;overflow:hidden;height:28px;flex:none}
.qty button{border:0;background:none;width:26px;height:100%;cursor:pointer;font-weight:800;color:var(--navy)}.qty button:hover{background:var(--green-s)}
.qty span{min-width:20px;text-align:center;font-weight:800;font-size:12.5px}
.sum{display:flex;justify-content:space-between;margin:5px 0;font-weight:500}.sum.tot{font-weight:800;font-size:16px;margin-top:8px}
.s-btn{width:100%;border:0;background:var(--green);color:var(--navy);border-radius:var(--leaf);padding:13px;font-weight:800;cursor:pointer;margin-top:14px;font-size:14px}
.s-btn:hover{background:#27a67b}.s-btn:disabled{opacity:.4;cursor:not-allowed}
.s-foot{border-top:1px solid var(--line);padding:16px 36px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:500}
.s-foot span{display:inline-flex;gap:8px;align-items:center}.s-foot img{height:22px}
.s-track{margin:18px 0 0;background:#fff;color:var(--navy);border-radius:var(--leaf);padding:14px 16px;position:relative;z-index:1}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.step{font-size:12px;font-weight:700;color:var(--n40)}.step i{display:block;height:5px;border-radius:99px;background:var(--n10);margin-bottom:6px}
.step.done{color:var(--navy)}.step.done i{background:var(--green)}
.s-closed{background:var(--red-s);color:var(--red);padding:10px 36px;font-weight:700}
.opt{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--n5);cursor:pointer;font-weight:600}
.opt input{width:16px;height:16px;accent-color:var(--green)}.opt .p{margin-left:auto;color:var(--muted)}
/* pos */
.pos{display:grid;grid-template-columns:250px 1fr 330px;gap:16px;align-items:start}
.floor{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tbl{border:1.5px solid var(--n10);background:#fff;border-radius:14px 4px 14px 4px;cursor:pointer;padding:9px;text-align:left;min-height:66px;display:flex;flex-direction:column;justify-content:space-between}
.tbl:hover{border-color:var(--n20)}
.tbl b{font-size:15px;font-weight:800}.tbl small{font-size:11px;color:var(--muted);font-weight:600}
.tbl.busy{background:var(--navy);border-color:var(--navy);color:#fff}.tbl.busy small{color:var(--green)}
.tbl.sel{border-color:var(--green);box-shadow:0 0 0 3px var(--green-m)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:16px}
.pbtn{border:1px solid var(--n10);background:#fff;border-radius:14px 4px 14px 4px;padding:11px 12px;text-align:left;cursor:pointer;min-height:80px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;position:relative}
.pbtn:before{content:"";position:absolute;left:12px;top:0;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--c,var(--green))}
.pbtn:hover{border-color:var(--green);background:#fbfefd}.pbtn .n{font-weight:700;line-height:1.3;margin-top:4px}.pbtn .p{color:var(--muted);font-size:12.5px;font-weight:700}
.pbtn:disabled{opacity:.4;cursor:not-allowed}
.tline{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--n5);font-weight:600}
.tline .q{width:26px;font-weight:800;color:var(--green-t)}
/* kitchen — navy from logo */
.kds{background:var(--navy);border-radius:22px 6px 22px 6px;padding:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start;min-height:70vh}
.kcol h3{color:#fff;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin:4px 6px 12px;display:flex;justify-content:space-between}
.kcol h3 span:last-child{background:var(--green);color:var(--navy);border-radius:10px;padding:0 8px}
.kt{background:#fff;border-radius:14px 4px 14px 4px;margin-bottom:12px;overflow:hidden;color:var(--navy)}
.kt .kh{display:flex;justify-content:space-between;align-items:center;padding:9px 13px;background:var(--green);color:var(--navy);font-weight:800}
.kt.warn .kh{background:#f2c14e}.kt.late .kh{background:var(--red);color:#fff}
.kt .kh .tm{font-size:15px}
.kt .km{padding:8px 13px;border-bottom:1px solid var(--n5);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;font-weight:600}
.kt ul{list-style:none;margin:0;padding:8px 13px}
.kt li{padding:5px 0;font-size:15px;font-weight:700}.kt li b{display:inline-block;width:28px;color:var(--green-t)}
.kt li .m{display:block;padding-left:28px;color:var(--n60);font-size:12.5px;font-weight:600}
.kt .kn{margin:0 13px 10px;padding:7px 9px;background:#fff5dc;color:#7a5410;border-radius:8px;font-size:12.5px;font-weight:700}
.kt .kb{display:grid;grid-template-columns:1fr auto;gap:8px;padding:0 13px 13px}
.kbtn{border:0;border-radius:10px;padding:10px;font-weight:800;cursor:pointer;background:var(--navy);color:#fff}
.kbtn:hover{background:#163352}
.kbtn.alt{background:var(--n5);color:var(--navy)}.kbtn.alt:hover{background:var(--n10)}
.kempty{border:1.5px dashed #2c4566;border-radius:14px;padding:30px;text-align:center;color:#7d8fa6;font-weight:600}
/* modal & drawer */
.modal{position:fixed;inset:0;background:rgba(13,34,57,.55);display:grid;place-items:center;z-index:50;padding:16px}
.hidden{display:none!important}
.dialog{background:#fff;border-radius:22px 6px 22px 6px;width:min(480px,100%);max-height:90vh;overflow:auto}
.dh{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 24px 0}
.dh h3{margin:0;font-size:18px;font-weight:800}.db{padding:16px 24px 24px}
.x{border:0;background:var(--n5);cursor:pointer;color:var(--navy);padding:6px;border-radius:50%;display:grid}.x:hover{background:var(--n10)}
.drawer-bg{position:fixed;inset:0;background:rgba(13,34,57,.4);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:41;display:flex;flex-direction:column;animation:slide .18s ease}
@keyframes slide{from{transform:translateX(30px);opacity:.5}}
.drawer .dh{padding:20px 24px;border-bottom:1px solid var(--line)}
.drawer .dbody{padding:18px 24px;overflow:auto;flex:1}
.drawer .dfoot{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:8px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin-bottom:18px}.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0;font-weight:700}
.sect{font-size:11px;font-weight:800;color:var(--n60);text-transform:uppercase;letter-spacing:.08em;margin:20px 0 8px}
.tl{position:relative;padding-left:18px}.tl div{position:relative;padding:0 0 12px;font-weight:600}.tl div:before{content:"";position:absolute;left:-15px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--green)}
.tl div:after{content:"";position:absolute;left:-11px;top:17px;bottom:-4px;width:2px;background:var(--n10)}.tl div:last-child:after{display:none}
#toasts{position:fixed;right:24px;top:72px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:16px 4px 16px 4px;font-weight:700;animation:in .2s ease;max-width:360px;display:flex;gap:11px;align-items:flex-start}
.toast .ti{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--green);color:var(--navy)}
.toast small{display:block;color:#a9b8ca;font-weight:500}
@keyframes in{from{transform:translateY(-8px);opacity:0}}
.settings{display:grid;grid-template-columns:240px 1fr;gap:32px;max-width:980px;padding:24px 0;border-top:1px solid var(--line)}
.settings h4{margin:0 0 4px;font-size:14.5px;font-weight:800}.settings p{margin:0;color:var(--muted);font-size:12.5px;font-weight:500}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:16px}
@media(max-width:1200px){.pos{grid-template-columns:220px 1fr}.pos .tk{grid-column:span 2}.dgrid{grid-template-columns:1fr!important}.s-body{grid-template-columns:1fr}.s-cart{position:static}}
@media(max-width:980px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow-x:auto}.nav-sec,.loc,.side-foot{display:none}.nav a{white-space:nowrap}.kpis{grid-template-columns:repeat(2,1fr)}.kds{grid-template-columns:1fr}.pos{grid-template-columns:1fr}.pos .tk{grid-column:auto}#view{padding:18px}.settings{grid-template-columns:1fr;gap:12px}.top{padding:0 18px}.s-nav nav{display:none}}

#callUI .ring{position:fixed;right:24px;bottom:24px;z-index:70;background:var(--navy);color:#fff;border-radius:22px 6px 22px 6px;padding:18px;width:340px;box-shadow:0 20px 50px rgba(13,34,57,.35);animation:in .2s}
.ph-ic{width:46px;height:46px;border-radius:50%;background:var(--green);color:var(--navy);display:grid;place-items:center;flex:none;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,184,138,.6)}100%{box-shadow:0 0 0 16px rgba(46,184,138,0)}}
.ring .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.cbtn{border:0;border-radius:12px;padding:11px;font-weight:800;cursor:pointer;display:flex;gap:6px;justify-content:center;align-items:center}
.cbtn.ok{background:var(--green);color:var(--navy)}.cbtn.no{background:#24405f;color:#fff}.cbtn.no:hover{background:var(--red)}
.call-bg{position:fixed;inset:0;background:rgba(13,34,57,.4);z-index:65}
.call-panel{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:#fff;z-index:66;display:flex;flex-direction:column;animation:slide .18s ease}
.call-head{background:var(--navy);color:#fff;padding:18px 22px;border-bottom-left-radius:28px}
.cav{width:44px;height:44px;border-radius:50%;background:var(--green);color:var(--navy);display:grid;place-items:center;font-weight:800}
.call-ctrls{display:flex;gap:8px;margin-top:16px}
.call-ctrls button{flex:1;border:0;border-radius:10px;padding:9px;font-weight:700;cursor:pointer;background:#1d3b5e;color:#fff;display:flex;gap:6px;justify-content:center;align-items:center}
.call-ctrls button.on{background:var(--green);color:var(--navy)}.call-ctrls button.end{background:var(--red)}
.call-body{flex:1;overflow:auto;padding:16px 22px}
.call-foot{padding:14px 22px;border-top:1px solid var(--line)}
.qi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--n5);font-weight:600}
.qi:last-child{border-bottom:0}
.mini{width:28px;height:28px;border-radius:9px 2px 9px 2px;border:0;background:var(--navy);color:var(--green);display:grid;place-items:center;cursor:pointer;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--n10);background:#fff;border-radius:16px;padding:4px 11px;font-weight:700;font-size:12px;cursor:pointer;color:var(--n80)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.okbox{background:var(--green-s);color:var(--green-t);border-radius:var(--leaf);padding:10px 12px;font-weight:700;margin-bottom:12px}
.gw{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--n5);flex-wrap:wrap}
.gw .lg{width:40px;height:40px;border-radius:12px 3px 12px 3px;background:var(--n5);display:grid;place-items:center;font-weight:800;color:var(--n60)}
.gw.on .lg{background:var(--navy);color:var(--green)}
.paym{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-bottom:8px}
.paym label{border:1.5px solid var(--n10);border-radius:10px;padding:8px;text-align:center;font-weight:700;cursor:pointer;font-size:12.5px;margin:0;color:var(--n80)}
.paym label:has(input:checked){border-color:var(--navy);background:var(--navy);color:#fff}
.paym input{display:none}

.app.incall{grid-template-columns:236px 1fr 430px}
.app.incall .call-panel{position:sticky;top:0;height:100vh;border-left:1px solid var(--line);background:#fff;display:flex;flex-direction:column;animation:slide .18s ease}
.app.incall .pos{grid-template-columns:1fr 280px}.app.incall .pos>.card:first-child{grid-column:1/-1}.app.incall .floor{grid-template-columns:repeat(6,1fr)}
.app.incall .kpis{grid-template-columns:repeat(2,1fr)}.app.incall .dgrid,.app.incall .live4{grid-template-columns:1fr!important}.app.incall .kds{grid-template-columns:repeat(2,1fr)}
.linkbtn{border:0;background:none;color:#9fb0c4;font-weight:700;font-size:12px;cursor:pointer;padding:2px 0}.linkbtn:hover{color:#fff}
.xfer{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.xfer button{border:1px solid #2a4669;background:#13304f;color:#fff;border-radius:10px;padding:8px 10px;text-align:left;font-weight:700;cursor:pointer}.xfer button:hover{border-color:var(--green)}
.xfer small{display:block;color:#9fb0c4;font-weight:500;font-size:11.5px}
.mt-hint{display:flex;gap:8px;align-items:center;background:var(--n5);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--n80);font-weight:600;margin-bottom:12px}
.callpill{position:fixed;right:24px;bottom:24px;z-index:70;background:var(--navy);color:#fff;border-radius:18px 5px 18px 5px;padding:10px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 14px 40px rgba(13,34,57,.35)}
.callpill .cbtn{padding:8px 14px}.cbtn.end{background:var(--red)}
.ph-ic.sm{width:34px;height:34px}
.live4{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:16px;margin-bottom:16px;align-items:start}
.member{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--n5)}.member:last-child{border-bottom:0}
.mav{width:34px;height:34px;border-radius:50%;background:var(--n5);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.mav.busy{background:var(--green);box-shadow:0 0 0 3px var(--green-s)}
.mini-sel{border:0;border-radius:14px;padding:3px 8px;font-weight:700;font-size:12px;cursor:pointer;outline:none}
.mini-sel.b-new{background:#fff;border:1px solid var(--n20)}
.prog{height:5px;border-radius:9px;background:var(--n5);margin-top:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--green);border-radius:9px}
.ivr{background:var(--navy);color:#fff;border-radius:var(--leaf);padding:12px 14px;font-size:13px;line-height:1.5;margin-top:12px}
.seg.ov button{padding:6px 4px;font-size:12px}
.mestatus{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font-weight:700;color:var(--navy);cursor:pointer;font-size:12.5px}
@media(max-width:1300px){.live4{grid-template-columns:1fr 1fr}}
@media(max-width:980px){.app.incall{grid-template-columns:1fr}.app.incall .call-panel{position:fixed;inset:0;z-index:66;height:auto}}

.code{position:relative;background:var(--navy);border-radius:12px;padding:14px 16px;margin-top:6px}
.code pre{margin:0;color:#d6e2ef;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;white-space:pre-wrap;word-break:break-all;padding-right:70px}
.code .btn{position:absolute;top:10px;right:10px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--n5);padding:1px 6px;border-radius:5px;color:var(--navy)}
.plug{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.plug button{border:1px solid var(--n10);background:#fff;border-radius:14px 4px 14px 4px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}.plug button:hover{border-color:var(--green)}
.mk{padding:16px 20px;border-bottom:1px solid var(--n5)}.mk:last-child{border-bottom:0}
.mkh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mk .lg{width:42px;height:42px;border-radius:12px 3px 12px 3px;background:var(--n5);display:grid;place-items:center;font-weight:800;color:var(--n60)}
.mk .lg.on{background:var(--navy);color:var(--green)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 0 54px}
.mset{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--n5);border-radius:12px;padding:10px 12px}.mset b{font-size:13px}
.pin{display:flex;align-items:center;gap:4px}.pin .input{width:64px;padding:5px 8px}
.srcmk{background:var(--navy);color:#fff}
@media(max-width:1200px){.mgrid{grid-template-columns:1fr 1fr;margin-left:0}.plug{grid-template-columns:repeat(3,1fr)}}
.egdemo{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--navy);color:#dfe7ef;padding:9px 20px;font-size:12.5px;font-weight:500;position:relative;z-index:30}
.egdemo b{color:var(--green)}.egdemo-a{display:flex;gap:14px;align-items:center}.egdemo a{color:#fff;font-weight:700}
.egdemo-btn{background:var(--green);color:var(--navy)!important;padding:5px 12px;border-radius:8px;text-decoration:none}
@media(max-width:980px){main,#view{min-width:0;max-width:100vw}.card{min-width:0}.ch{flex-wrap:wrap;gap:6px}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}.dgrid,.live4,.pos,.s-body,.settings,.row2,.app.incall .pos{grid-template-columns:minmax(0,1fr)!important}
.tabs{overflow-x:auto}.mgrid{grid-template-columns:minmax(0,1fr)!important;margin-left:0}.plug{grid-template-columns:repeat(2,minmax(0,1fr))}.kds{grid-template-columns:minmax(0,1fr)}
.s-nav,.s-head,.s-foot{padding-left:16px;padding-right:16px}.s-body{padding:0 16px 16px}.s-foot{flex-wrap:wrap;gap:8px}
.top{height:auto;min-height:60px;flex-wrap:wrap;padding:10px 16px}.top-r{flex-wrap:wrap;gap:8px}.gw,.mkh,.set-row{flex-wrap:wrap}.ph h1{font-size:21px}}
@media(max-width:520px){.kpis{grid-template-columns:minmax(0,1fr)!important}.floor{grid-template-columns:repeat(3,minmax(0,1fr))}.legend{flex-wrap:wrap}}

function makeOrder(st,o){
  const sub=o.items.reduce((s,i)=>s+i.price*i.qty,0);
  const fee=o.type==='Delivery'?+st.settings.deliveryFee:0;
  const num=st.nextNum++,t=o.createdAt||Date.now();
  const card=pick(['Visa','Mastercard','Amex','Apple Pay']);
  const pay=o.source==='Online'?{status:'Paid',method:card==='Apple Pay'?'Apple Pay':card+' •••• '+rnd(1000,9999)}:{status:'Unpaid',method:'—'};
  return {id:'o'+num,num,source:o.source,type:o.type,table:o.table||null,customer:o.customer,phone:o.phone||'',address:o.address||'',note:o.note||'',
    items:o.items,subtotal:sub,fee,total:sub+fee,status:'new',createdAt:t,history:[{s:'new',t}],payment:pay};
}
function applyStatus(o,s,t=Date.now()){
  o.status=s;o.history.push({s,t});
  if(s==='completed'&&o.payment.status==='Unpaid')o.payment={status:'Paid',method:pick(['Visa •••• '+rnd(1000,9999),'Mastercard •••• '+rnd(1000,9999),'Cash','EFTPOS'])};
  if(s==='cancelled'&&o.payment.status==='Paid')o.payment.status='Refunded';
}

/* ---------- helpers & events ---------- */
function modal(html,focus=true){const m=$('#modal');m.innerHTML=`<div class="dialog">${html}</div>`;m.classList.remove('hidden');const f=m.querySelector('input:not([type=checkbox])');if(focus&&f)setTimeout(()=>f.focus(),30)}
function closeModal(){$('#modal').classList.add('hidden');$('#modal').innerHTML='';draft=null}
function toast(msg,sub=''){const t=document.createElement('div');t.className='toast';t.innerHTML=`<span class="ti">${ic(I.check)}</span><div>${esc(msg)}${sub?`<small>${esc(sub)}</small>`:''}</div>`;$('#toasts').appendChild(t);while($('#toasts').children.length>3)$('#toasts').firstChild.remove();setTimeout(()=>t.remove(),3800)}
function setStatus(id,s){
  const o=S.orders.find(x=>x.id===id);if(!o||o.status===s)return;applyStatus(o,s);
  if(s==='ready'&&o.source==='Online')toast(`Order #${o.num} is ready`,`SMS sent to ${o.customer}`);
  else if(s==='cancelled')toast(`Order #${o.num} cancelled`,o.payment.status==='Refunded'?'Payment refunded to customer':'');
  else if(s==='completed')toast(`Order #${o.num} completed`);
  commit();
}
function addNew(o){S.orders.push(o);toast(`New order #${o.num} · ${money(o.total)}`,chan(o)+' · '+(o.type==='Dine-in'?'Table '+o.table.slice(1):o.customer));commit()}

document.addEventListener('click',e=>{
  if(e.target.id==='modal'){closeModal();return}
  const g=e.target.closest('[data-go]');if(g){location.hash=g.dataset.go;return}
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.tagName==='A')e.preventDefault();
  const a=el.dataset.act,id=el.dataset.id;
  const ci=S.cart.find(c=>c.key===id),pi=pos.items.find(i=>i.id===id),mi=S.menu.find(m=>m.id===id);
  switch(a){

    case 'openItem':openItem(id);break;

document.addEventListener('submit',e=>{
  e.preventDefault();const fd=new FormData(e.target),f=Object.fromEntries(fd);
  if(e.target.id==='coForm'){
    const items=cartLines().map(c=>({id:c.id,name:c.name,cat:c.cat,mods:c.mods.concat(c.note?['“'+c.note+'”']:[]),price:c.price,qty:c.qty}));
    if(!items.length){closeModal();return}
    const note=[f.when!=='As soon as possible'?'Scheduled for '+f.when:'',f.note].filter(Boolean).join(' · ');
    const o=makeOrder(S,{source:'Online',type:S.mode,customer:f.name.trim(),phone:f.phone,address:f.address,note,items});
    o.payment=f.pay==='Pay at pickup'?{status:'Unpaid',method:'Pay at pickup'}:{status:'Paid',method:f.pay==='Card'||!f.pay?'Visa •••• 4242':f.pay};

  }
  if(e.target.id==='gwForm'){const n=e.target.dataset.gwName;S.gateway.connected[n]=f.mode;if(!S.gateway.primary)S.gateway.primary=n;closeModal();toast(n+' connected',f.mode+' mode');commit()}
  if(e.target.id==='mkForm'){const n=e.target.dataset.name,m=S.channels.markets[n];m.connected=true;m.storeId=Math.random().toString(36).slice(2,10);m.auto=!!f.auto;m.lastSync=Date.now();m.paused=false;closeModal();toast(n+' connected',f.push?S.menu.filter(x=>x.online).length+' menu items published':'Orders will now appear in your kitchen');commit()}
  if(e.target.id==='itemForm'){
    S.menu.push({id:'m'+Date.now(),name:f.name.trim(),cat:f.cat,price:+f.price,desc:f.desc||'',diet:fd.getAll('diet'),avail:true,online:true,popular:false});
    closeModal();toast(`${f.name} added to menu`,'Now available on storefront and POS');commit();

    ['name','address','phone','abn'].forEach(k=>S.settings[k]=f[k].trim());

    toast('Settings saved');commit();
  }
});

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer()}});

let tick=0;
setInterval(()=>{
  tick++;const idle=$('#modal').classList.contains('hidden')&&!drawerId&&!document.activeElement.matches('input,textarea,select');
  live.filter(l=>Date.now()>=l.ends).forEach(endLive);
  if(tick%5===0)processQueue();
  if(call&&call.phase==='ringing'&&tick%2===0)renderCall();
  if(call&&call.phase==='ringing'&&Date.now()-call.ringAt>S.route.ringTimeout*1000){const c=callerOf(call);call=null;renderCall();toast('No answer — redirecting',c.name||c.number);routeCall(c,'me')}
  if(call&&call.phase==='active'&&$('#callTimer'))$('#callTimer').textContent=fmtDur(Math.round((Date.now()-call.start)/1000));
  if(S.settings.autoSim&&tick%45===20)routeCall(newCaller());
  if(S.settings.autoSim&&tick%30===0){addNew(randomOrder(S));return}
  if(!idle)return;
  if(view==='kitchen'||view==='calls')render();
  else if(tick%15===0&&['dashboard','store','pos'].includes(view))render();
},1000);

I.calls=I.phone;I.payments='<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>';
I.mic='<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/>';
I.pause='<path d="M9 5v14M15 5v14"/>';
let call=null,live=[],queue=[];
const fmtDur=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const initials=n=>{const w=(n||'?').trim().split(/\s+/);return (w.length>1?w[0][0]+w[1][0]:w[0].slice(0,2)).toUpperCase()};
const randPhone=()=>'04'+rnd(10,99)+' '+rnd(100,999)+' '+rnd(100,999);
const staffName=id=>id==='ai'?'AI assistant':(S.staff.find(s=>s.id===id)||{}).name||'—';
function newCaller(){
  const known=S.orders.filter(o=>o.phone);
  if(known.length&&Math.random()<.6){const o=pick(known);return {number:o.phone,name:o.customer,count:S.orders.filter(x=>x.phone===o.phone).length}}
  return {number:randPhone(),name:'',count:0};
}
const callerOf=c=>({number:c.number,name:c.name,count:c.count||0,wait:c.wait||0});
function freeStaff(skip){return S.staff.filter(s=>s.status==='available'&&s.id!==skip&&!(s.id==='me'&&call)&&!live.some(l=>l.staffId===s.id))}
function startCall(c,extra){call={phase:'ringing',dir:'in',...c,ringAt:Date.now(),items:[],type:'Pickup',address:'',pay:'link',cat:'All',muted:false,held:false,min:false,...extra};renderCall()}
function routeCall(c,skip){
  let f=freeStaff(skip);
  if(S.route.strategy==='robin')f=[...f].sort((a,b)=>(a.last||0)-(b.last||0));
  const s=f[0];
  if(!s){overflow(c);return}
  s.last=Date.now();
  if(s.id==='me'){startCall(c);return}
  live.push({id:'l'+Date.now()+rnd(0,999),staffId:s.id,...c,start:Date.now(),ends:Date.now()+rnd(35,90)*1000});
  const me=S.staff.find(x=>x.id==='me');
  toast(`Call routed to ${s.name} · ${s.device}`,`${c.name||c.number}${call?' — you are on a call':me.status!=='available'?' — you are '+me.status:''}`);
  save();
}
function overflow(c){
  const o=S.overflow,en=['hold','ai','callback'].filter(k=>o.options[k]);
  if(!en.length){S.calls.unshift({id:'c'+Date.now(),from:c.number,name:c.name,status:'missed',dir:'in',start:Date.now(),dur:0,orderId:null});toast('Missed call — all staff busy',c.name||c.number);save();return}
  const ch=o.mode==='choose'?pick(en):(en.includes(o.mode)?o.mode:en[0]);
  const pre=o.mode==='choose'?`Caller pressed ${en.indexOf(ch)+1} · `:'';
  if(ch==='hold'){queue.push({...c,since:Date.now()});toast('All staff busy — caller on hold',`${pre}${c.name||c.number} · position ${queue.length}`)}
  if(ch==='ai'){live.push({id:'l'+Date.now()+rnd(0,999),staffId:'ai',...c,start:Date.now(),ends:Date.now()+rnd(25,40)*1000});toast('AI assistant answered',pre+(c.name||c.number))}
  if(ch==='callback'){S.callbacks.unshift({id:'cb'+Date.now()+rnd(0,99),...c,at:Date.now(),status:'pending'});toast('Callback requested',pre+(c.name||c.number))}
  save();
}
function phoneOrder(name,number,note){
  const type=Math.random()<.75?'Pickup':'Delivery';
  const o=makeOrder(S,{source:'Phone',type,customer:name,phone:number,address:type==='Delivery'?rnd(2,180)+' '+pick(STREETS)+', Collingwood VIC 3066':'',items:randomItems(S),note});
  o.payment={status:'Pending',method:'SMS payment link'};S.orders.push(o);
  const oid=o.id;setTimeout(()=>{const x=S.orders.find(y=>y.id===oid);if(x&&x.payment.status==='Pending'){x.payment={status:'Paid',method:'Visa •••• '+rnd(1000,9999)+' (link)'};save()}},12000);
  return o;
}
function endLive(l){
  live=live.filter(x=>x!==l);let o=null;
  if(l.staffId==='ai'){if(S.overflow.aiOrders){o=phoneOrder(l.name||pick(NAMES),l.number,'Taken by AI assistant');toast(`AI assistant took order #${o.num}`,`${money(o.total)} · payment link sent to ${l.number}`)}}
  else if(Math.random()<.6){o=phoneOrder(l.name||pick(NAMES),l.number,'');toast(`${staffName(l.staffId)} sent order #${o.num} to the kitchen`,money(o.total)+' · phone order')}
  S.calls.unshift({id:'c'+Date.now()+rnd(0,99),from:l.number,name:l.name||(o?o.customer:''),status:'answered',dir:'in',start:l.start,dur:Math.round((Date.now()-l.start)/1000),orderId:o?o.id:null,by:staffName(l.staffId),wait:l.wait||0});
  processQueue();save();
}
function processQueue(){
  const o=S.overflow;
  queue.slice().forEach(q=>{if(Date.now()-q.since>o.maxHold*MIN&&o.options.callback){queue=queue.filter(x=>x!==q);S.callbacks.unshift({id:'cb'+Date.now()+rnd(0,99),number:q.number,name:q.name,count:q.count,at:Date.now(),status:'pending',auto:true});toast('Moved to callback list',`${q.name||q.number} waited over ${o.maxHold} min`)}});
  while(queue.length&&freeStaff().length){const q=queue.shift();routeCall({...callerOf(q),wait:Math.round((Date.now()-q.since)/1000)})}
}
function logCall(status){
  S.calls.unshift({id:'c'+Date.now(),from:call.number,name:call.name,status,dir:call.dir,start:call.start||call.ringAt,dur:call.start?Math.round((Date.now()-call.start)/1000):0,orderId:call.orderId||null,by:'RJ',wait:call.wait||0});
  call=null;renderCall();processQueue();commit();
}
function renderCall(){
  const el=$('#callUI');
  document.querySelector('.app').classList.toggle('incall',!!call&&call.phase==='active'&&!call.min);
  if(!call){el.innerHTML='';return}
  if(call.phase==='ringing'){
    const others=freeStaff('me').map(s=>s.name);
    el.innerHTML=`<div class="ring"><div style="display:flex;gap:14px;align-items:center"><div class="ph-ic">${ic(I.phone)}</div><div><div class="small" style="color:#9fb0c4;font-weight:700">${call.wait?'From queue · waited '+fmtDur(call.wait):'Incoming call · '+esc(S.settings.phone)}</div><div style="font-size:17px;font-weight:800">${call.name?esc(call.name):esc(call.number)}</div>
      <div class="small" style="color:#9fb0c4">${call.name?esc(call.number)+' · Returning customer · '+call.count+' order'+(call.count===1?'':'s'):'New caller'}</div></div></div>
      <div class="small" style="color:#9fb0c4;margin-top:12px">${others.length?`If you don't answer in ${S.route.ringTimeout}s it goes to ${esc(others[0])}.`:`No one else is free — overflow rules apply if unanswered.`}</div>
      <div class="acts"><button class="cbtn no" data-act="callDecline">${others.length?'Redirect':'Decline'}</button><button class="cbtn ok" data-act="callAccept">${ic(I.phone)}Accept</button></div></div>`;

    api:`<p class="muted" style="margin-top:0">For custom websites and apps. Read your live menu, create orders and receive status updates.</p>
      <div class="row2"><div><div class="sect" style="margin-top:0">Endpoints</div><div class="small" style="line-height:1.9"><code>GET /v1/menu</code> live menu, prices, stock<br><code>POST /v1/orders</code> create an order<br><code>GET /v1/orders/{id}</code> order status<br><code>POST /v1/payments/intent</code> start card payment</div></div>
      <div><div class="sect" style="margin-top:0">Webhooks</div>${['order.created','order.status_changed','menu.updated','payment.succeeded'].map(e=>`<label class="opt" style="padding:5px 0;border:0"><input type="checkbox" ${W.hooks.includes(e)?'checked':''} data-hook="${e}"><code>${e}</code></label>`).join('')}</div></div>
      <div class="field" style="margin-top:10px"><label>Webhook URL</label><input class="input" data-web="hookUrl" value="${esc(W.hookUrl)}" placeholder="https://yoursite.com/webhooks/orders"></div>
      <div class="field"><label>API key</label><div style="display:flex;gap:8px"><input class="input" readonly value="sk_live_••••••••••••4f2a"><button class="btn" data-act="newKey">Roll key</button></div></div>${code('api')}`
  };
  const kp=(n,st,on)=>`<div class="card kpi"><div class="l">${n}</div><div class="v">${on?money(st.s):'—'}</div><span class="muted small">${on?st.n+' orders today':'Not connected'}</span></div>`;
  return `<div class="ph"><div><h1>Channels</h1><p>Connect your own website and delivery apps. Every order lands in the same kitchen display, order list and reports.</p></div><div class="acts"><button class="btn primary" data-act="simMarket">Simulate delivery-app order</button></div></div>
  <div class="kpis">${kp('Website & storefront',stat('Online'),1)}${MARKETS.map(m=>kp(m,stat(m),C.markets[m].connected)).join('')}</div>
  <div class="card" style="margin-bottom:16px"><div class="ch"><div><h3>Your website</h3><div class="sub">${esc(W.domain)}</div></div><span class="badge b-preparing">Connected</span></div>
   <div class="tabs" style="padding:0 14px">${tabs.map(([k,l])=>`<button class="tab ${webTab===k?'on':''}" data-act="webTab" data-id="${k}">${l}</button>`).join('')}</div><div class="cb">${body[webTab]}</div></div>
  <div class="card"><div class="ch"><h3>Delivery apps</h3><span class="sub">Orders flow straight to the kitchen · menu, prices and stock stay in sync</span></div>
   ${MARKETS.map(n=>{const m=C.markets[n];const t=(k,l,d)=>`<div class="mset"><div><b>${l}</b><div class="small muted">${d}</div></div><button class="switch ${m[k]?'on':''}" data-act="mkSet" data-id="${n}|${k}"></button></div>`;
    return `<div class="mk"><div class="mkh"><div class="lg ${m.connected?'on':''}">${{'Uber Eats':'UE','DoorDash':'DD','Menulog':'ML'}[n]}</div><div style="flex:1"><b style="font-size:14.5px">${n}</b> ${m.connected?(m.paused?'<span class="badge b-cancelled">Paused</span>':'<span class="badge b-preparing">Live</span>'):''}
      <div class="small muted">${m.connected?`Store ID ${esc(m.storeId)} · Menu last synced ${ago(m.lastSync)}`:MDESC[n]}</div></div>
      ${m.connected?`<button class="btn sm" data-act="mkSync" data-id="${n}">Sync menu now</button><button class="btn sm danger" data-act="mkOff" data-id="${n}">Disconnect</button>`:`<button class="btn primary sm" data-act="mkConnect" data-id="${n}">Connect</button>`}</div>
      ${m.connected?`<div class="mgrid">${t('auto','Auto-accept orders','Send straight to the kitchen')}${t('syncMenu','Sync menu & prices','Push changes from Menu')}${t('syncStock','Sync stock','Sold-out items hide on the app')}${t('paused','Pause store','Stop new orders from this app')}
       <div class="mset"><div><b>Price markup</b><div class="small muted">Offsets platform commission</div></div><div class="pin"><input class="input" type="number" min="0" max="50" data-mk="${n}|markup" value="${m.markup}"><span>%</span></div></div>
       <div class="mset"><div><b>Commission</b><div class="small muted">From your agreement, for reports</div></div><div class="pin"><input class="input" type="number" min="0" max="50" data-mk="${n}|commission" value="${m.commission}"><span>%</span></div></div></div>`:''}</div>`}).join('')}</div>`;
}
function openMarket(n){
  modal(`<div class="dh"><div><h3>Connect ${n}</h3><div class="muted small" style="margin-top:3px">You’ll sign in to ${n} and approve access to your store.</div></div><button class="x" data-act="closeModal">${ic(I.x)}</button></div>
  <form id="mkForm" class="db" data-name="${n}">
   <ol class="small" style="padding-left:18px;margin:0 0 16px;line-height:1.8;color:var(--n80)"><li>Sign in with your ${n} merchant account</li><li>Choose the store to link</li><li>We import orders and keep your menu, prices and stock in sync</li></ol>
   <div class="field"><label>${n} store</label><select class="input" name="store"><option>${esc(S.settings.name)} — Collingwood</option></select><div class="hint">In the live product this list comes from ${n} after you sign in.</div></div>
   <label class="opt"><input type="checkbox" name="push" checked>Replace the ${n} menu with my menu</label>
   <label class="opt"><input type="checkbox" name="auto" checked>Auto-accept orders</label>
   <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn primary" type="submit">Sign in &amp; connect</button></div></form>`,false);
}
function marketOrder(st,src,t){
  const m=st.channels.markets[src],k=1+(+m.markup||0)/100;
  const items=randomItems(st).map(i=>({...i,price:Math.round(i.price*k*2)/2}));
  const type=Math.random()<.8?'Delivery':'Pickup';
  const o=makeOrder(st,{source:src,type,customer:pick(NAMES).replace(/ (\w)\w*$/,' $1.'),items,createdAt:t,note:Math.random()<.1?'Leave at door':''});
  o.fee=0;o.total=o.subtotal;o.extId={'Uber Eats':'UE','DoorDash':'DD','Menulog':'ML'}[src]+'-'+Math.random().toString(36).slice(2,7).toUpperCase();
  o.payment={status:'Paid',method:src+' payout'};
  if(type==='Delivery')o.address=src+' courier';
  return o;
}

route();
</script>
</body>
